<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C21B63"/>
      <stop offset="1" stop-color="#7A0F3B"/>
    </linearGradient>
    <linearGradient id="nail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD3E2"/>
      <stop offset="0.45" stop-color="#FF9EC2"/>
      <stop offset="1" stop-color="#FF6FA5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- P in serif, protagonista -->
  <text x="180" y="352" font-family="Georgia, 'Times New Roman', serif"
        font-size="330" fill="#FFFFFF" text-anchor="middle">P</text>

  <!-- unghia a mandorla, laccata, inclinata accanto alla P -->
  <g transform="translate(352 300) rotate(22)">
    <path d="M 0 -118 C 26 -86 44 -46 44 4 C 44 66 28 108 0 108 C -28 108 -44 66 -44 4 C -44 -46 -26 -86 0 -118 Z"
          fill="url(#nail)"/>
    <!-- punta french sulla mandorla -->
    <path d="M 0 -118 C 20 -93 34 -64 40 -30 C 22 -46 -22 -46 -40 -30 C -34 -64 -20 -93 0 -118 Z"
          fill="#FFFFFF" opacity="0.92"/>
    <!-- riflesso -->
    <path d="M -26 -50 C -30 -10 -28 40 -20 72" stroke="#FFFFFF" stroke-width="10"
          stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>

  <!-- scintille -->
  <path d="M 96 96 l 7 22 22 7 -22 7 -7 22 -7 -22 -22 -7 22 -7 Z" fill="#FFD3E2"/>
  <path d="M 420 120 l 5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 Z" fill="#FFD3E2" opacity="0.85"/>
  <path d="M 150 420 l 4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" fill="#FFD3E2" opacity="0.7"/>
</svg>
